<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src https: http: data:;"
  />
  <title>Home</title>
  <link rel="stylesheet" href="newtabstyle.css" />
</head>
<body>
  <main>
    <section class="hero">
      <div id="time"></div>
      <div id="welcome"></div>
      <div id="date"></div>
    </section>

    <form id="search" autocomplete="off">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round">
        <circle cx="11" cy="11" r="7" />
        <line x1="16.5" y1="16.5" x2="21" y2="21" />
      </svg>
      <input id="q" type="text" spellcheck="false" placeholder="Search Google or enter a URL" />
    </form>

    <section>
      <h2>Favorites</h2>
      <div id="favorites" class="grid"></div>
    </section>

    <section>
      <h2>Recently visited</h2>
      <div id="recent" class="recent"></div>
    </section>
  </main>

  <dialog id="add-dialog">
    <form id="add-form" autocomplete="off">
      <h3>Add favorite</h3>
      <input id="add-name" type="text" placeholder="Name (e.g. GitHub)" />
      <input id="add-url" type="text" placeholder="Website (e.g. github.com)" />
      <p id="add-error"></p>
      <div class="actions">
        <button type="button" id="add-cancel">Cancel</button>
        <button type="submit" class="primary">Add</button>
      </div>
    </form>
  </dialog>

  <script src="newtab.js"></script>
</body>
</html>
