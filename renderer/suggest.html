<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline';" />
  <title>Suggestions</title>
  <style>
    html, body {
      margin: 0; height: 100%; overflow: hidden;
      background: #2b2b2b; color: #fff;
      font: 13px system-ui, -apple-system, "Segoe UI", sans-serif;
      user-select: none;
    }
    #list { padding: 4px; }
    .item {
      display: flex; align-items: center; gap: 8px;
      height: 36px; padding: 0 10px; border-radius: 8px;
      cursor: pointer; white-space: nowrap; overflow: hidden;
    }
    .item.active, .item:hover { background: rgba(255,255,255,0.14); }
    .text, .sub { overflow: hidden; text-overflow: ellipsis; }
    .sub { color: rgba(255,255,255,0.55); font-size: 12px; }
  </style>
</head>
<body>
  <div id="list"></div>
  <script src="../dist/suggest.js"></script>
</body>
</html>
